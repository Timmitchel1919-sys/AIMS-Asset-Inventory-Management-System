<!doctype html>
<html lang="en" data-theme="kcs-forest-gold">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta id="kcs-theme-color" name="theme-color" content="#015B2B" />
    <meta name="description" content="A school inventory and asset-management platform for St. Kangoeroe Community School." />
    <meta name="application-name" content="AIMS Asset &amp; Inventory Management System" />
    <meta property="og:title" content="AIMS Asset &amp; Inventory Management System" />
    <meta property="og:description" content="A school inventory and asset-management platform for St. Kangoeroe Community School." />
    <meta property="og:type" content="website" />
    <link id="kcs-favicon" rel="icon" type="image/png" href="/aims-logo-blue.png" />
    <link id="kcs-apple-icon" rel="apple-touch-icon" href="/aims-logo-blue.png" />
    <link id="kcs-manifest" rel="manifest" href="/manifest-forest.webmanifest" />
    <title>AIMS Asset &amp; Inventory Management System</title>
    <script>
      (function(){try{var t=localStorage.getItem('kcs-theme');var blue=t==='kcs-azure-intelligence';var valid=t==='kcs-forest-gold'||blue;var selected=valid?t:'kcs-forest-gold';var logo=blue?'/aims-logo-blue.png':'/aims-logo-green.png';document.documentElement.dataset.theme=selected;document.getElementById('kcs-theme-color').content=blue?'#1769C2':'#015B2B';document.getElementById('kcs-favicon').href=logo;document.getElementById('kcs-apple-icon').href=logo;document.getElementById('kcs-manifest').href=blue?'/manifest-azure.webmanifest':'/manifest-forest.webmanifest'}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
