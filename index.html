<!doctype html>
<html lang="en" data-theme="kcs-azure-intelligence">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta id="kcs-theme-color" name="theme-color" content="#000000" />
    <meta name="description" content="A school inventory and asset-management platform for St. Kangoeroe Community School." />
    <meta name="application-name" content="AIMS Asset &amp; Inventory Management System" />
    <meta property="og:title" content="AIMS Asset &amp; Inventory Management System" />
    <meta property="og:description" content="A school inventory and asset-management platform for St. Kangoeroe Community School." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/aims-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/aims-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/aims-180.png" />
    <link id="kcs-manifest" rel="manifest" href="/manifest-azure.webmanifest" />
    <title>AIMS Asset &amp; Inventory Management System</title>
    <script>
      (function(){try{var t=localStorage.getItem('authenticatedThemePreference')||localStorage.getItem('kcs-theme');var green=t==='aimsEmeraldGloss'||t==='emerald-gloss'||t==='aimsEmeraldGlass'||t==='kcs-forest-gold';document.documentElement.dataset.theme=green?'emerald-gloss':'kcs-azure-intelligence';document.getElementById('kcs-manifest').href=green?'/manifest-emerald-gloss.webmanifest':'/manifest-azure.webmanifest'}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
