name: Functions tests
on:
  push:
    branches: [main]
    paths: ["functions/**"]
  pull_request:
    paths: ["functions/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
