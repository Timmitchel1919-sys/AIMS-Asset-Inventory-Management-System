# PR preview deploy for AIMS.
#
# This workflow builds the application in PRESENTATION MODE (synthetic,
# in-memory mock data) and publishes it to a Firebase Hosting preview
# channel. The build is intentionally NOT given any VITE_FIREBASE_* env
# vars, so src/lib/firebase.ts initializes no Firebase client at all
# (missingFirebaseEnvironmentVariables.length > 0 → firebaseConfigured
# false → app, firebaseAuth, firestore, firebaseStorage, firebaseFunctions,
# firebaseAi all null). The runtime consequence is that the preview URL
# cannot read, write, or authenticate against production Firestore / Auth
# / Storage / Cloud Functions, and MockRepositoryProvider is the only
# repository that can be mounted (src/main.tsx RepositoryProvider branch).
#
# The hosting-deploy action deploys a NON-LIVE preview channel only
# (the production-channel flag is intentionally omitted below), so this
# workflow cannot replace the production Hosting site. It also cannot
# deploy Firestore rules, indexes, or Cloud Functions — those require
# separate `firebase deploy --only ...` steps which do not exist here.
#
# A security-regression vitest guard
# (src/security/presentation-mode-isolation.test.ts) pins each of these
# invariants so any accidental re-introduction of production-build
# behavior fails CI before a PR is opened.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Presentation build: synthetic in-memory data, no Firebase client.
      # VITE_APP_MODE is set inline here (not via .env.presentation, which is
      # gitignored and therefore not available to the CI runner). This makes
      # `src/main.tsx` select MockRepositoryProvider and `AppContext` short-
      # circuit every Firebase code path.
      # No VITE_FIREBASE_* secrets are injected — the Firebase env guard in
      # vite.config.ts only fires for `mode === "production"`, and
      # `src/lib/firebase.ts` leaves every service accessor null when those
      # env vars are absent. Defense in depth: even if presentation mode were
      # ever bypassed, no Firebase client would initialize.
      - run: npm install --no-package-lock && npm run build:presentation
        env:
          VITE_APP_MODE: presentation
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIMS_ASSET_INVENTORY_SYSTEM }}
          projectId: aims-asset-inventory-system
          # The `channelId` key is intentionally omitted → deploys to an
          # auto-generated preview channel (default 7-day expiration).
          # Production Hosting is untouched.
          expires: 7d
